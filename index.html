<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture In Picture</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Script -->
    <script src="./js/script.js" defer></script>
</head>
<body>
    <video id="video" playsinline hidden></video>
    <main class="app">
        <div class="button-container">
            <button id="start-button" type="button" data-action="start">Start</button>
            <button id="pip-button" type="button" data-action="pip" disabled>Open PiP</button>
            <button id="mute-button" type="button" data-action="mute" disabled>Unmute</button>
            <button id="pause-button" type="button" data-action="pause" disabled>Pause</button>
            <button id="stop-button" type="button" data-action="stop" disabled>Stop</button>
        </div>
        <p id="status" aria-live="polite">Click Start to choose a screen, window, or tab to share.</p>
    </main>
</body>
</html>
